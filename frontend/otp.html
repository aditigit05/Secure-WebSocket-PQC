<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP Verification | Secure Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .otp-input {
      width: 3rem;
      height: 3.25rem;
      font-size: 1.25rem;
      text-align: center;
    }
    body{
      min-height: 100vh;
      background: radial-gradient(1200px circle at 10% 10%, rgba(13,110,253,.25), transparent 60%),
                  radial-gradient(900px circle at 90% 20%, rgba(25,135,84,.25), transparent 55%),
                  linear-gradient(135deg, #0b1220, #0f1b3a 45%, #0b1220);
      color: #e9eefc;
    }
    #glass-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="#">
        🔐 Secure PQC Chat
      </a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0" id="glass-card">
          <div class= "card-body p-4 p-md-5">
            <h3 class="fw-bold mb-1 text-white">Verify OTP</h3>
            <p class="text-white mb-4">
              Enter the 6-digit OTP sent to your email/phone.
            </p>

            <form id="otpForm" novalidate>
              <div class="d-flex justify-content-between gap-2 mb-3">
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
                <input class="form-control otp-input" inputmode="numeric" maxlength="1" required>
              </div>

              <div class="invalid-feedback d-block" id="otpError" style="display:none;">
                
              </div>

              <button class="btn btn-success w-100 py-2" type="submit">Verify & Continue</button>

              <div class="d-flex justify-content-between align-items-center mt-3">
                <button class="btn btn-link text-white p-0 text-decoration-none" type="button" id="resendBtn">
                  Resend OTP
                </button>
                <small class="text-white" id="timerText">Resend available in 30s</small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const inputs = Array.from(document.querySelectorAll(".otp-input"));
    const otpForm = document.getElementById("otpForm");
    const otpError = document.getElementById("otpError");

    inputs[0].focus();

    inputs.forEach((inp, idx) => {
      inp.addEventListener("input", () => {
        inp.value = inp.value.replace(/[^0-9]/g, "");
        if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      });

      inp.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
      });

      inp.addEventListener("paste", (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
        if (!text) return;
        for (let i = 0; i < inputs.length; i++) {
          inputs[i].value = text[i] || "";
        }
        inputs[Math.min(text.length, inputs.length) - 1].focus();
      });
    });

    function getOtp() {
      return inputs.map(i => i.value).join("");
    }

    otpForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const otp = getOtp();
      if (otp.length !== 6 || /[^0-9]/.test(otp)) {
        otpError.style.display = "block";
        return;
      }
      otpError.style.display = "none";

      window.location.href = "chat.html";
    });

    const resendBtn = document.getElementById("resendBtn");
    const timerText = document.getElementById("timerText");
    let remaining = 30;
    resendBtn.disabled = true;

    const t = setInterval(() => {
      remaining--;
      timerText.textContent = remaining > 0 ? `Resend available in ${remaining}s` : "You can resend OTP now";
      if (remaining <= 0) {
        clearInterval(t);
        resendBtn.disabled = false;
      }
    }, 1000);

    resendBtn.addEventListener("click", () => {
      alert("OTP resent (demo).");
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
